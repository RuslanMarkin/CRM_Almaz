name: Передача пакета между этапами SDLC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sdlc/handoffs/**"

permissions:
  contents: read
  issues: write

jobs:
  create-next-stage-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tree = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: context.sha,
              recursive: "true",
            });
            const handoffs = tree.data.tree.filter((entry) =>
              entry.type === "blob" && entry.path.startsWith("sdlc/handoffs/") && entry.path.endsWith(".json")
            );
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            for (const entry of handoffs) {
              const file = await github.rest.repos.getContent({ owner, repo, path: entry.path, ref: context.sha });
              const handoff = JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8"));
              if (!["ready_for_development", "ready_for_qa"].includes(handoff.stage)) continue;
              const marker = `<!-- sdlc-handoff:${handoff.featureId}:${handoff.stage} -->`;
              if (openIssues.some((issue) => issue.body?.includes(marker))) continue;
              const artifactUrl = `https://github.com/${owner}/${repo}/blob/${context.sha}/${entry.path}`;
              const role = handoff.nextExecutor === "qa" ? "QA" : "Разработка";
              await github.rest.issues.create({
                owner,
                repo,
                title: `[${role}] ${handoff.featureId}: ${handoff.title}`,
                body: `${marker}\n\nАвтоматическая передача на этап **${handoff.stage}**.\n\nHandoff: ${artifactUrl}\n\nСледующий исполнитель: **${handoff.nextExecutor}**.\n\nОбязательные проверки:\n${handoff.requiredChecks.map((check) => `- [ ] ${check}`).join("\n")}`,
              });
            }

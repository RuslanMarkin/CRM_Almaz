name: Auto-merge подтверждённых SDLC PR

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let number = null;
            if (context.payload.pull_request) number = context.payload.pull_request.number;
            if (!number && context.payload.check_suite?.pull_requests?.length) {
              number = context.payload.check_suite.pull_requests[0].number;
            }
            if (!number) return;

            const pull = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const head = pull.data.head.ref;
            const base = pull.data.base.ref;
            const isStage = head.startsWith("stage/") && base.startsWith("feature/");
            const isFinalFeature = head.startsWith("feature/") && base === "main";
            if (!isStage && !isFinalFeature) return;

            const handoffs = await github.rest.git.getTree({ owner, repo, tree_sha: pull.data.head.sha, recursive: "true" });
            const entries = handoffs.data.tree.filter((entry) => entry.type === "blob" && entry.path?.startsWith("sdlc/handoffs/") && entry.path?.endsWith(".json"));
            let handoff = null;
            for (const entry of entries) {
              const file = await github.rest.repos.getContent({ owner, repo, path: entry.path, ref: pull.data.head.sha });
              const value = JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8"));
              if (value.schemaVersion !== 2) continue;
              if ((isStage && value.stageBranch === head && value.workStatus === "ready_for_review") || (isFinalFeature && value.stage === "qa" && value.workStatus === "ready_for_review")) {
                handoff = value;
                break;
              }
            }
            if (!handoff) return;

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const lastReviewByUser = new Map();
            for (const review of reviews) {
              const previous = lastReviewByUser.get(review.user.login);
              if (!previous || review.id > previous.id) lastReviewByUser.set(review.user.login, review);
            }
            // Do not trust an approval made for an earlier head SHA. Branch
            // protection should also dismiss stale approvals, but this makes
            // the workflow safe even before that repository setting is live.
            const currentReviews = [...lastReviewByUser.values()].filter((review) => review.commit_id === pull.data.head.sha);
            const decisions = currentReviews.map((review) => review.state);
            if (!decisions.includes("APPROVED") || decisions.includes("CHANGES_REQUESTED")) return;

            const result = await github.graphql(`query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) { id autoMergeRequest { enabledAt } viewerCanEnableAutoMerge }
              }
            }`, { owner, repo, number });
            const target = result.repository.pullRequest;
            if (!target.viewerCanEnableAutoMerge || target.autoMergeRequest) return;
            try {
              await github.graphql(`mutation($id:ID!) {
                enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}) { pullRequest { autoMergeRequest { enabledAt } } }
              }`, { id: target.id });
            } catch (error) {
              core.warning(`Не удалось включить auto-merge для PR #${number}: ${error.message}`);
            }

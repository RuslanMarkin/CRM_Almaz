name: Проверки проекта

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile
      - name: Проверить типы
        run: pnpm check
      - name: Запустить тесты
        run: pnpm test
      - name: Проверить Git-native SDLC-контракт
        run: pnpm test:sdlc
      - name: Проверить handoff аналитика
        run: pnpm sdlc:validate

name: Event-driven SDLC runner

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'sdlc:start') &&
      (github.event.action == 'opened' || github.event.label.name == 'sdlc:start')
    runs-on: ubuntu-latest
    concurrency:
      group: sdlc-start-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      SDLC_DATABASE_URL: ${{ secrets.SDLC_DATABASE_URL }}
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RuslanMarkin/langgraph-sdlc-platform
          ref: main
          path: .sdlc-platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить SDLC-runner
        run: pip install ./.sdlc-platform
      - name: Запустить аналитический этап
        run: >-
          python -m agent_platform.github_actions_runner start
          --issue-number "${{ github.event.issue.number }}"
          --project-root "$GITHUB_WORKSPACE"
          --evidence package.json
          --evidence shared/types.ts
          --evidence drizzle/schema.ts
          --evidence server/routers.ts
          --evidence client/src/pages/Counterparties.tsx
          --evidence client/src/pages/CounterpartyDetail.tsx

  resume:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.body, '<!-- sdlc-thread:')
    runs-on: ubuntu-latest
    concurrency:
      group: sdlc-resume-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      SDLC_DATABASE_URL: ${{ secrets.SDLC_DATABASE_URL }}
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RuslanMarkin/langgraph-sdlc-platform
          ref: main
          path: .sdlc-platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить SDLC-runner
        run: pip install ./.sdlc-platform
      - name: Продолжить процесс по комментарию человека
        run: >-
          python -m agent_platform.github_actions_runner resume
          --approval-issue-number "${{ github.event.issue.number }}"
          --comment-id "${{ github.event.comment.id }}"
          --project-root "$GITHUB_WORKSPACE"
          --evidence package.json
          --evidence shared/types.ts
          --evidence drizzle/schema.ts
          --evidence server/routers.ts
          --evidence client/src/pages/Counterparties.tsx
          --evidence client/src/pages/CounterpartyDetail.tsx

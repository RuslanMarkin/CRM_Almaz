services:
  mysql:
    image: mysql:8.0
    container_name: almaz_mysql
    restart: always
    env_file:
      - app.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max_connections=50
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    image: logistics-docs:latest
    container_name: almaz_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - app.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
